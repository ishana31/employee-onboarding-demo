spring.application.name=employee-onboarding

# Default datasource: H2 in-memory database for seamless local execution and verification
spring.datasource.url=jdbc:h2:mem:onboarding_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
